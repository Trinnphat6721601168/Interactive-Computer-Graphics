<!DOCTYPE html>
<html>

<head>
    <title>Materials with Light Controls</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // --- แสงบรรยากาศ (Ambient Light) ---
        const abmientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(abmientLight);

        // --- แสงอาทิตย์ (Directional Light) ---
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        
        // ตั้งค่าระยะและคุณภาพเงา
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        
        scene.add(directionalLight);

        // Helper เพื่อดูตำแหน่งดวงอาทิตย์/ทิศทางแสง (เปิด/ปิด ได้ใน UI)
        const lightHelper = new THREE.DirectionalLightHelper(directionalLight, 2);
        scene.add(lightHelper);

        // --- โหลด Skybox EXR ---
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // --- พื้นผิว (Floor) ---
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- โมเดลตัวละคร (GLTF Loader) ---
        const loader = new THREE.GLTFLoader();
        loader.load('https://trinnphat6721601168.github.io/Interactive-Computer-Graphics//Character.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.position.set(0, 0, 0);
            scene.add(model);
        });

        // ==========================================
        //  ส่วน UI ควบคุมแสงอาทิตย์ (lil-gui)
        // ==========================================
        const gui = new lil.GUI({ title: '☀️ ปรับแต่งแสง (Sun Light)' });

        // ปรับตำแหน่งดวงอาทิตย์ (X, Y, Z)
        const sunFolder = gui.addFolder('ตำแหน่งพระอาทิตย์');
        sunFolder.add(directionalLight.position, 'x', -50, 50, 0.1).name('มุมซ้าย-ขวา (X)').onChange(() => lightHelper.update());
        sunFolder.add(directionalLight.position, 'y', 0, 50, 0.1).name('ความสูง (Y)').onChange(() => lightHelper.update());
        sunFolder.add(directionalLight.position, 'z', -50, 50, 0.1).name('มุมหน้า-หลัง (Z)').onChange(() => lightHelper.update());

        // ปรับความสว่างและสีแสง
        const lightProps = {
            sunColor: '#ffffff',
            ambientColor: '#404040',
            showHelper: true
        };

        const styleFolder = gui.addFolder('ความสว่าง & สี');
        styleFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('ความสว่างแสงอาทิตย์');
        styleFolder.addColor(lightProps, 'sunColor').name('สีแสงอาทิตย์').onChange((value) => {
            directionalLight.color.set(value);
        });

        styleFolder.add(abmientLight, 'intensity', 0, 3, 0.1).name('ความสว่างบรรยากาศ');
        styleFolder.addColor(lightProps, 'ambientColor').name('สีบรรยากาศ').onChange((value) => {
            abmientLight.color.set(value);
        });

        // เปิด/ปิด ตัวช่วยดูทิศทางแสง (Helper)
        gui.add(lightProps, 'showHelper').name('แสดงตัวช่วยทิศทางแสง').onChange((visible) => {
            lightHelper.visible = visible;
        });

        // Loop การทำงาน
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
