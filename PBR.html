<!DOCTYPE html>
<html>

<head>
    <title>Materials with Light Controls</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        
        const abmientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(abmientLight);

        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        
        
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        
        scene.add(directionalLight);

        
        const lightHelper = new THREE.DirectionalLightHelper(directionalLight, 2);
        scene.add(lightHelper);

        // --- โหลด Skybox EXR ---
        const exrSkyboxUrl = 'https://trinnphat6721601168.github.io/Interactive-Computer-Graphics//background.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

       
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

       
        const loader = new THREE.GLTFLoader();
        loader.load('https://trinnphat6721601168.github.io/Interactive-Computer-Graphics//Character.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.position.set(0, 0, 0);
            scene.add(model);
        });

       
        const gui = new lil.GUI({ title: 'Custom light' });

        
        const sunFolder = gui.addFolder('Position of Sun Light');
        sunFolder.add(directionalLight.position, 'x', -50, 50, 0.1).name('X:').onChange(() => lightHelper.update());
        sunFolder.add(directionalLight.position, 'y', 0, 50, 0.1).name('Y:').onChange(() => lightHelper.update());
        sunFolder.add(directionalLight.position, 'z', -50, 50, 0.1).name('Z:').onChange(() => lightHelper.update());

        
        const lightProps = {
            sunColor: '#ffffff',
            ambientColor: '#404040',
            showHelper: true
        };

        const styleFolder = gui.addFolder('Brightness & Color');
        styleFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('Intensity Sunlight');
        styleFolder.addColor(lightProps, 'sunColor').name('Color Sunlight').onChange((value) => {
            directionalLight.color.set(value);
        });

        styleFolder.add(abmientLight, 'intensity', 0, 3, 0.1).name('Ambient Light Intensity');
        styleFolder.addColor(lightProps, 'ambientColor').name('Color Ambient').onChange((value) => {
            abmientLight.color.set(value);
        });

        
        gui.add(lightProps, 'showHelper').name('Helper').onChange((visible) => {
            lightHelper.visible = visible;
        });

        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
